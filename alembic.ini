# Alembic configuration for OpsMind AI.
#
# The database connection URL is intentionally NOT set here. It is built at
# runtime in migrations/env.py from app.core.config.settings (the same
# POSTGRES_* environment variables the application itself uses), so there
# are no hardcoded credentials in version control and dev/staging/production
# environments each pick up their own values automatically.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S